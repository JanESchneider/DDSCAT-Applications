# ----------------------------------------------------------------------
# Example configuration for a compact homogeneous sphere
#
# Ready to run if DDSCAT is installed in ~/DDA.
# ----------------------------------------------------------------------


# ----------------------------------------------------------------------
# Paths
# ----------------------------------------------------------------------

[paths]

# Compiled DDSCAT executable
ddscat_executable = "~/ddscat/src/ddscat"

# Run directory.
# It will be created automatically.
run_directory = "./runs/solid_sphere"

# Optical constants
material_file = "~/ddscat/examples_exp/diel/astrosil"


# ----------------------------------------------------------------------
# Target
# ----------------------------------------------------------------------

[target]

# Built-in ellipsoid.
# Equal axes give a sphere.
shape = "ELLIPSOID"

# Target dimensions in dipole units.
#
# Equal values give a sphere with approximately D/d = 70.
# These numbers determine the dipole resolution, not the
# physical grain radius.
shape_parameters = [70.0, 70.0, 70.0]


# ----------------------------------------------------------------------
# Effective radius
# ----------------------------------------------------------------------

[effective_radius]

# Effective radius in micrometres.
#
# For a single radius:
# minimum_um = maximum_um
# count = 1

minimum_um = 1.0
maximum_um = 1.0
count = 1
spacing = "LIN"


# ----------------------------------------------------------------------
# Wavelength grid
# ----------------------------------------------------------------------

[wavelength]

minimum_um = 0.3
maximum_um = 20.0
count = 60
spacing = "LOG"


# ----------------------------------------------------------------------
# DDSCAT numerical parameters
# ----------------------------------------------------------------------

[numerics]

# Iterative solver
solver = "PBCGS2"

# FFT method
fft = "GPFAFT"

# Dipole polarizability prescription
polarizability = "GKDLDR"

# Solver convergence tolerance
tolerance = 1.0e-5

# Maximum number of solver iterations
max_iterations = 1000

# Interaction cutoff parameter
gamma = 1.0e-2

# Angular resolution parameter
eta_sca = 0.5

# Initial DDSCAT dipole-grid allocation
memory = [100, 100, 100]

# Refractive index of surrounding medium.
# 1.0 = vacuum
ambient_refractive_index = 1.0

# Enable/disable near-field calculation
nearfield = false


# ----------------------------------------------------------------------
# Target orientation
# ----------------------------------------------------------------------

[orientation]

# Each list contains:
# [minimum angle, maximum angle, number of values]

beta = [0.0, 0.0, 1]
theta = [0.0, 0.0, 1]
phi = [0.0, 0.0, 1]


# ----------------------------------------------------------------------
# Output
# ----------------------------------------------------------------------

[output]

# Number of incident polarization states.
#
# 1 = one incident polarization
# 2 = two orthogonal incident polarizations
iorth = 2

# DDSCAT IWRKSC
write_sca = 0

# Mueller-matrix elements written to output
mueller_elements = [11, 12, 21, 22, 31, 41]


# ----------------------------------------------------------------------
# Scattering directions
# ----------------------------------------------------------------------

[scattering]

# Reference frame
frame = "LFRAME"

# Each row:
#
# [phi, theta_min, theta_max, theta_step]
#
# Angles are in degrees.

planes = [[0.0, 0.0, 180.0, 5.0]]